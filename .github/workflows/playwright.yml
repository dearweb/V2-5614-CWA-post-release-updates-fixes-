name: Playwright Tests & GitHub Pages Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  test:
    name: Spec Matrix (${{ matrix.name }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'cwa-ip-flow'
            spec: 'tests/cwa-ip-flow.spec.ts'
          - name: 'member-area-v2-preview'
            spec: 'tests/member-area-v2-preview.spec.ts'
          - name: 'upsell-auto-select'
            spec: 'tests/upsell-auto-select.spec.ts'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright Version for Cache
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> $GITHUB_ENV

      - name: Cache Playwright Browser Binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install-deps chromium
          fi

      - name: Run Playwright Test Spec (${{ matrix.spec }})
        run: npx playwright test ${{ matrix.spec }} --reporter=blob

      - name: Upload Blob Report Artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.name }}
          path: blob-report/
          retention-days: 7

  compile-and-deploy-report:
    name: Compile & Deploy Unified Report
    needs: test
    if: ${{ always() && !cancelled() && needs.test.result != 'cancelled' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download all blob reports from matrix runs
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge Playwright Blob Reports into HTML Report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload Unified HTML Report Artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-unified
          path: playwright-report/
          retention-days: 30

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add Report Link to Workflow Summary
        if: ${{ always() && steps.deployment.outputs.page_url != '' }}
        run: |
          echo "## 📊 Test Report Deployed to GitHub Pages" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Live Report URL:** [View Playwright HTML Report](${{ steps.deployment.outputs.page_url }})" >> $GITHUB_STEP_SUMMARY
          echo "🕒 **Deployed At:** $(date -u)" >> $GITHUB_STEP_SUMMARY
